  <div class="container">

      Don't worry — let's get you back on track.
    </p>

      <a href="/" class="btn btn-primary">Back to Home</a>
      <a href="https://wa.me/8615017434683" class="btn btn-secondary" target="_blank" rel="noopener">Contact Us</a>
    </div>

      Need help? Reach us on
      <a href="https://wa.me/8615017434683" target="_blank" rel="noopener">WhatsApp</a>
      or email
      <a href="mailto:soey@casatriohome.com">soey@casatriohome.com</a>
    </p>
  </div>
<script>
// CASA TRIO Conversion Tracking
document.addEventListener('DOMContentLoaded', function() {
  
  // 1. Track WhatsApp clicks
  document.querySelectorAll('a[href*="wa.me"], a[href*="whatsapp"]').forEach(function(link) {
    link.addEventListener('click', function() {
      var linkText = this.textContent.trim() || 'WhatsApp Link';
      var pagePath = window.location.pathname;
      gtag('event', 'whatsapp_click', {
        'event_category': 'Contact',
        'event_label': linkText + ' | ' + pagePath,
        'page_path': pagePath
      });
    });
  });
  
  // 2. Track CTA button clicks (Start Your Project, Get Started, etc.)
  var ctaKeywords = ['start your project', 'get started', 'start on whatsapp', 'learn more', 
                      'contact us', 'book a', 'request', 'pay', 'commitment deposit'];
  document.querySelectorAll('a, button').forEach(function(el) {
    var text = el.textContent.trim().toLowerCase();
    var isCTA = ctaKeywords.some(function(keyword) {
      return text.indexOf(keyword) !== -1;
    });
    if (isCTA) {
      el.addEventListener('click', function() {
        gtag('event', 'cta_click', {
          'event_category': 'CTA',
          'event_label': this.textContent.trim() + ' | ' + window.location.pathname,
          'button_text': this.textContent.trim(),
          'page_path': window.location.pathname
        });
      });
    }
  });
  
  // 3. Track form submissions
  document.querySelectorAll('form').forEach(function(form) {
    form.addEventListener('submit', function() {
      gtag('event', 'form_submit', {
        'event_category': 'Form',
        'event_label': form.id || form.name || 'Unnamed Form',
        'page_path': window.location.pathname
      });
    });
  });
  
  // 4. Track scroll depth (25%, 50%, 75%, 100%)
  var scrollDepths = [25, 50, 75, 100];
  var scrollTracked = {};
  
  window.addEventListener('scroll', function() {
    var scrollTop = window.pageYOffset || document.documentElement.scrollTop;
    var docHeight = document.documentElement.scrollHeight - window.innerHeight;
    var scrollPercent = Math.round((scrollTop / docHeight) * 100);
    
    scrollDepths.forEach(function(depth) {
      if (scrollPercent >= depth && !scrollTracked[depth]) {
        scrollTracked[depth] = true;
        gtag('event', 'scroll_depth', {
          'event_category': 'Engagement',
          'event_label': depth + '%',
          'scroll_percent': depth,
          'page_path': window.location.pathname
        });
      }
    });
  });
  
  // 5. Track outbound links (external links)
  document.querySelectorAll('a[href^="http"]').forEach(function(link) {
    if (!link.href.includes(window.location.hostname) && 
        !link.href.includes('wa.me') && 
        !link.href.includes('whatsapp')) {
      link.addEventListener('click', function() {
        gtag('event', 'outbound_click', {
          'event_category': 'Outbound',
          'event_label': this.href,
          'page_path': window.location.pathname
        });
      });
    }
  });
});
</script>
